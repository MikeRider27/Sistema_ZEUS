# Sistema ZEUS: aplicacion web + PostgreSQL interno
#   docker compose up -d --build   ->  http://localhost:8080  (usuario ADMIN)
name: zeus

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZEUS_DB_NAME:-zeus}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      ZEUS_DB_USER: ${ZEUS_DB_USER:-zeus_app}
      ZEUS_DB_PASSWORD: ${ZEUS_DB_PASSWORD:?definir ZEUS_DB_PASSWORD en .env}
      ZEUS_ADMIN_PASSWORD: ${ZEUS_ADMIN_PASSWORD:?definir ZEUS_ADMIN_PASSWORD en .env}
      TZ: America/Asuncion
      PGTZ: America/Asuncion
    volumes:
      - zeus_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # sin "ports": la base solo es accesible desde la red interna de compose
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./app
    image: zeus-app:2.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ZEUS_DB_HOST: db
      ZEUS_DB_PORT: 5432
      ZEUS_DB_NAME: ${ZEUS_DB_NAME:-zeus}
      ZEUS_DB_USER: ${ZEUS_DB_USER:-zeus_app}
      ZEUS_DB_PASSWORD: ${ZEUS_DB_PASSWORD}
      ZEUS_BLOQUEO_MINUTOS: ${ZEUS_BLOQUEO_MINUTOS:-15}
      TZ: America/Asuncion
    ports:
      - "${ZEUS_PORT:-8080}:8080"
    networks: [interna]

volumes:
  zeus_db:

networks:
  interna:
    # subred explicita: evita depender de los pools por defecto de Docker
    ipam:
      config:
        - subnet: ${ZEUS_SUBNET:-10.89.27.0/24}
