<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-label="ZEUS Chapería y Pintura">
  <defs>
    <linearGradient id="carroceria" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/>
      <stop offset=".55" stop-color="#d7261e"/>
      <stop offset="1" stop-color="#8e130e"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe3f2"/>
      <stop offset="1" stop-color="#6f8da3"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5b301"/>
    </linearGradient>
  </defs>
  <!-- niebla de pintura -->
  <g fill="#d7261e" opacity=".35">
    <circle cx="196" cy="30" r="3"/><circle cx="206" cy="22" r="2"/><circle cx="188" cy="20" r="2.5"/>
    <circle cx="214" cy="34" r="1.8"/><circle cx="200" cy="12" r="1.5"/><circle cx="182" cy="34" r="1.6"/>
  </g>
  <!-- carroceria -->
  <path d="M18 84 L24 66 Q28 58 40 56 L78 52 L102 34 Q108 30 118 30 L160 30 Q170 30 176 38 L190 54
           L212 58 Q222 60 224 70 L226 84 Z" fill="url(#carroceria)" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/>
  <path d="M86 52 L106 37 Q110 35 116 35 L138 35 L138 52 Z" fill="url(#vidrio)" stroke="#1f2328" stroke-width="2"/>
  <path d="M144 35 L160 35 Q166 35 170 40 L180 52 L144 52 Z" fill="url(#vidrio)" stroke="#1f2328" stroke-width="2"/>
  <path d="M30 66 L214 66" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  <!-- ruedas -->
  <g stroke="#1f2328" stroke-width="3">
    <circle cx="62" cy="86" r="16" fill="#2b3036"/><circle cx="62" cy="86" r="7" fill="#b8bec6"/>
    <circle cx="186" cy="86" r="16" fill="#2b3036"/><circle cx="186" cy="86" r="7" fill="#b8bec6"/>
  </g>
  <!-- rayo de Zeus -->
  <path d="M130 2 L112 44 L128 44 L116 78 L150 30 L133 30 L146 2 Z" fill="url(#rayo)" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- pistola de pintura -->
  <g transform="translate(206 2) rotate(25)" stroke="#1f2328" stroke-width="2" stroke-linejoin="round">
    <rect x="0" y="8" width="26" height="9" rx="2" fill="#b8bec6"/>
    <rect x="-8" y="10" width="9" height="5" fill="#8a9099"/>
    <path d="M18 17 L22 34 L14 34 L12 17 Z" fill="#5b6169"/>
    <path d="M8 0 L18 0 L16 8 L10 8 Z" fill="#f5b301"/>
  </g>
  <!-- gotas -->
  <path d="M40 98 q3 6 0 9 q-3 -3 0 -9z M150 100 q3 6 0 9 q-3 -3 0 -9z" fill="#d7261e"/>
  <rect x="10" y="104" width="220" height="5" rx="2.5" fill="#1f2328" opacity=".25"/>
</svg>
