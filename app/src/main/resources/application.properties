spring.application.name=Sistema ZEUS
server.port=8080
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# conexion (antes: config.properties + postgres/root hardcodeado en conectarDB)
spring.datasource.url=jdbc:postgresql://${ZEUS_DB_HOST:localhost}:${ZEUS_DB_PORT:5432}/${ZEUS_DB_NAME:zeus}
spring.datasource.username=${ZEUS_DB_USER:zeus_app}
spring.datasource.password=${ZEUS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.thymeleaf.cache=true
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# minutos de inactividad antes de bloquear la pantalla (antes: InactivityListener)
zeus.bloqueo-minutos=${ZEUS_BLOQUEO_MINUTOS:15}
# copia de seguridad (pg_dump)
zeus.db.host=${ZEUS_DB_HOST:localhost}
zeus.db.port=${ZEUS_DB_PORT:5432}
zeus.db.name=${ZEUS_DB_NAME:zeus}
