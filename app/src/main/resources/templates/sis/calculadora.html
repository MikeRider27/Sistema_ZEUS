<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments :: head('Calculadora')}"></head>
<body class="ventana" style="align-items:center">
<div class="etched" style="width:260px">
    <input type="text" id="vis" class="num" readonly style="width:100%;height:32px;font-size:18px;margin-bottom:6px" value="0">
    <div id="teclas" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px"></div>
</div>
<div class="botonera"><button type="button" class="btn" id="btnExit" onclick="Z.salir()"><img src="/img/salir.png" alt="">Salir</button></div>
<script>
(function () {
    const vis = Z.$('#vis');
    let acum = null, op = null, nuevo = true;
    const calc = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '×' ? a * b : o === '÷' ? (b === 0 ? NaN : a / b) : b;
    const val = () => Number(vis.value.replace(',', '.'));
    function tecla(k) {
        if (/[0-9]/.test(k)) { vis.value = nuevo || vis.value === '0' ? k : vis.value + k; nuevo = false; }
        else if (k === ',') { if (nuevo) { vis.value = '0,'; nuevo = false; } else if (!vis.value.includes(',')) vis.value += ','; }
        else if (k === 'C') { vis.value = '0'; acum = null; op = null; nuevo = true; }
        else if (k === '←') { vis.value = vis.value.length > 1 ? vis.value.slice(0, -1) : '0'; }
        else if (k === '±') { vis.value = String(-val()).replace('.', ','); }
        else if (k === '%') { vis.value = String(acum !== null ? acum * val() / 100 : val() / 100).replace('.', ','); }
        else if (k === '=') { if (op) { vis.value = String(calc(acum, val(), op)).replace('.', ','); acum = null; op = null; nuevo = true; } }
        else { acum = op && !nuevo ? calc(acum, val(), op) : val(); op = k; nuevo = true; vis.value = String(acum).replace('.', ','); }
    }
    ['C', '←', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '-', '1', '2', '3', '+', '±', '0', ',', '='].forEach(k => {
        const b = Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: k });
        b.style.minWidth = '0'; b.onclick = () => tecla(k); Z.$('#teclas').appendChild(b);
    });
    const mapa = { '*': '×', '/': '÷', 'Enter': '=', 'Backspace': '←', 'Delete': 'C', '.': ',' };
    document.addEventListener('keydown', e => { const k = mapa[e.key] || e.key; if (/^[0-9+\-×÷=,%C←]$/.test(k)) { e.preventDefault(); tecla(k); } });
})();
</script>
</body>
</html>
