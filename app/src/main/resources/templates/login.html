<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema ZEUS</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/zeus.css">
</head>
<body class="login">
<form class="login-win" method="post" th:action="@{/login}" autocomplete="off">
    <div class="t"><img src="/img/favicon.svg" alt=""> Sistema ZEUS - Ingreso</div>
    <div class="cabecera">
        <img src="/img/zeus-logo.svg" alt="Logo ZEUS">
        <h2>ZEUS</h2>
        <div class="lema">Chapería &amp; Pintura</div>
    </div>
    <div class="cuerpo">
        <div class="form-grid una">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" class="upper" maxlength="30" required autofocus>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" maxlength="60" required>
        </div>
    </div>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="ok" th:if="${param.salir}">Sesión cerrada correctamente</div>
    <div class="botonera">
        <button type="submit" class="btn"><img src="/img/sesion.png" alt="">Ingresar</button>
    </div>
</form>
</body>
</html>
